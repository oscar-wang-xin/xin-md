<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="XIN-MD">
  <!--
    冷白机甲字标「X」：冷白面板 + 灰蓝缝线 + 机甲黑 X + 底部接口槽。
    配色即「冷白机甲」主题三色：机甲黑 #15181d / 灰蓝 #6f7786 / 冷白 #f2f4f7。
    字形走路径而非 <text>，避免不同系统字体不一致甚至不渲染；
    线条刻意加粗、留白拉开 —— 16px 下细笔画和小留白会直接消失。
  -->
  <rect x="0.8" y="0.8" width="30.4" height="30.4" rx="6.5" fill="#f2f4f7" stroke="#6f7786" stroke-width="1.6"/>
  <g fill="none" stroke="#15181d" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 两条对角线交叉成 X -->
    <path d="M9.8 8.8 22.2 21.8"/>
    <path d="M22.2 8.8 9.8 21.8"/>
  </g>
  <!-- 机甲面板接口槽 -->
  <rect x="13" y="25.6" width="6" height="1.8" rx="0.9" fill="#6f7786"/>
</svg>
