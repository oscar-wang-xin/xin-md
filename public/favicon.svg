<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="XIN-MD">
  <!--
    印章字标「X」：实心陶土橙底 + 白字。
    笔画刻意加粗、字身放大、四笔之间拉开距离 —— 16px 下字形最容易糊成一团，
    细笔画和小留白在那个尺寸下会直接消失。字形走路径而非 <text>，
    避免不同系统字体不一致甚至不渲染。
  -->
  <rect width="32" height="32" rx="7.5" fill="#d97757"/>
  <g fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- 两条对角线交叉成 X -->
    <path d="M9.6 9.6 22.4 22.4"/>
    <path d="M22.4 9.6 9.6 22.4"/>
  </g>
</svg>
